name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vesper
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      XDG_CACHE_HOME: /tmp/vesper-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
      - name: Cache pinned player downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}
          key: vesper-players-xcode27-${{ hashFiles('Dependencies/**/artifacts.json', 'Scripts/Prepare*.py') }}
      - name: Render native icon appearances
        run: bash Scripts/RenderIconPreviews.sh
      - name: Verify and build unsigned IPA
        shell: bash
        run: |
          mkdir -p xtool
          bash Scripts/Verify.sh vesper 2>&1 | tee xtool/build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vesper-build-log
          path: xtool/build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vesper
          path: |
            xtool/Vesper.ipa
            xtool/Vesper.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload matching debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vesper-symbols
          path: .build/xcode/Vesper/Vesper.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
      - name: Upload icon previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vesper-icon-previews
          path: xtool/icon-previews
          if-no-files-found: error
          retention-days: 14
